# NTP-служба сервера Digital Signage: раздаёт время мини-ПК.
#
# Сама синхронизируется с российскими серверами точного времени
# (ВНИИФТРИ — государственный эталон РФ, MSK-IX). Если интернета нет
# (изолированная сеть), директива local позволяет раздавать собственные
# часы сервера (stratum 10) — вся сеть остаётся согласованной между
# собой, даже без внешнего эталона.
#
# ВАЖНО: chronyd запускается с флагом -x (см. Dockerfile) — он только
# РАЗДАЁТ время, не пытаясь подводить часы контейнера (часы контейнера —
# это часы хост-машины, ими управляет ОС сервера).

server ntp1.vniiftri.ru iburst
server ntp2.vniiftri.ru iburst
server ntp.msk-ix.ru iburst
pool ru.pool.ntp.org iburst

# Раздавать собственные часы, если внешние источники недоступны
local stratum 10

# Отвечать всем (доступ ограничивается тем, что порт 123/udp открыт
# только внутрь сети мини-ПК на уровне сетевой инфраструктуры)
allow all

driftfile /var/lib/chrony/drift
