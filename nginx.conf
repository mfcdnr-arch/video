worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Скорость отдачи файлов мини ПК (ограничение чтобы не перегружать сеть).
    # 20m = 20 МБ/с на соединение — для ~10 экранов и файлов ~500 МБ.
    # Панель/API отдаются мгновенно (мелкие ответы лимита не достигают). 0 = без ограничения.
    limit_rate 20m;

    # WebSocket-апгрейд: заголовок Connection ставим только для реальных
    # WS-запросов. Безусловный Connection: upgrade ломает keep-alive обычных
    # HTTP-запросов к API.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Встроенный DNS Docker. Нужен, потому что адрес апстрима задан ПЕРЕМЕННОЙ
    # (см. $ds_api ниже): так nginx перепроверяет имя api каждые valid=10s.
    # Без этого имя резолвится один раз при старте, и после пересоздания
    # контейнера api (docker compose up -d --force-recreate api) прокси
    # продолжает бить по старому IP — вся панель отдаёт 502 «чёрная панель»,
    # хотя сам api здоров. Раньше это лечили рестартом nginx вручную или
    # через selfheal.sh; теперь не возникает.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Апстрим через переменную — включает перерезолв имени по resolver
        # выше. Из-за переменной nginx НЕ подставляет URI сам, поэтому там,
        # где путь меняется, стоит явный rewrite ... break.
        set $ds_api http://api:8000;

        # Отдача видеофайлов мини ПК для скачивания
        location /media/ {
            alias /data/media/;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "no-cache";
            # Разрешаем докачку (Range-запросы)
        }

        # WebSocket агентов. Отдельной локацией (более длинный префикс, чем
        # /api/) — чтобы соединение не рвалось по proxy_read_timeout и чтобы
        # путь совпадал с роутом FastAPI: /api/ws/agent/{id} → /ws/agent/{id}.
        location /api/ws/ {
            rewrite ^/api/ws/(.*)$ /ws/$1 break;
            proxy_pass $ds_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            # Апгрейд-запрос мелкий, ограничение скорости тут только мешает
            limit_rate 0;
        }

        # API FastAPI
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $ds_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            client_max_body_size 2G;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # WebSocket дашборд
        location /ws/ {
            proxy_pass $ds_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            limit_rate 0;
        }

        # Swagger UI (доступ только из локальной сети)
        location /docs {
            proxy_pass $ds_api;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass $ds_api;
        }

        # Статус сервера
        location /health {
            proxy_pass $ds_api;
        }

        # Токен авторизации (для Swagger UI)
        location /token {
            proxy_pass $ds_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Админ-панель (статика). Файлы монтируются в /usr/share/nginx/panel.
        location / {
            root /usr/share/nginx/panel;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
