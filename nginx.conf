worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Скорость отдачи файлов мини ПК (ограничение чтобы не перегружать сеть).
    # 20m = 20 МБ/с на соединение — для ~10 экранов и файлов ~500 МБ.
    # Панель/API отдаются мгновенно (мелкие ответы лимита не достигают). 0 = без ограничения.
    limit_rate 20m;

    # WebSocket-апгрейд: заголовок Connection ставим только для реальных
    # WS-запросов. Безусловный Connection: upgrade ломает keep-alive обычных
    # HTTP-запросов к API.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Встроенный DNS Docker. Нужен, потому что адрес апстрима задан ПЕРЕМЕННОЙ
    # (см. $ds_api ниже): так nginx перепроверяет имя api каждые valid=10s.
    # Без этого имя резолвится один раз при старте, и после пересоздания
    # контейнера api (docker compose up -d --force-recreate api) прокси
    # продолжает бить по старому IP — вся панель отдаёт 502 «чёрная панель»,
    # хотя сам api здоров. Раньше это лечили рестартом nginx вручную или
    # через selfheal.sh; теперь не возникает.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Апстрим через переменную — включает перерезолв имени по resolver
        # выше. Из-за переменной nginx НЕ подставляет URI сам, поэтому там,
        # где путь меняется, стоит явный rewrite ... break.
        set $ds_api http://api:8000;

        # Файлы медиатеки — только по входу (правило — server/media_access.py).
        # Номера и имена роликов угадываются, поэтому без проверки отсюда
        # выкачивалась бы вся медиатека, включая ролики на модерации.

        # Просмотр ролика в панели: <video src="/media/<имя>"> несёт httpOnly-
        # cookie ds_media. Перед отдачей nginx спрашивает API (auth_request):
        # 401/403 — тот же код клиенту, 204 — файл отдаётся отсюда с Range
        # (перемотка). Агент этим путём не качает.
        location /media/ {
            auth_request /_media_auth;
            alias /data/media/;
            add_header Cache-Control "private, no-cache";
        }

        # Подзапрос auth_request: в API уходят только заголовки (Cookie,
        # Authorization), без тела. Снаружи сюда не попасть (internal).
        location = /_media_auth {
            internal;
            rewrite ^ /files/auth break;
            proxy_pass $ds_api;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Отдача файла после проверки: GET /api/files/download/{id} (агент по
        # X-Token, «Скачать» в панели) отвечает пустым телом с заголовком
        # X-Accel-Redirect: /_media_files/<имя>, и файл выдаёт сам nginx — с
        # Range (докачка агента), sendfile и limit_rate. Снаружи — только так.
        location /_media_files/ {
            internal;
            alias /data/media/;
        }

        # WebSocket агентов. Отдельной локацией (более длинный префикс, чем
        # /api/) — чтобы соединение не рвалось по proxy_read_timeout и чтобы
        # путь совпадал с роутом FastAPI: /api/ws/agent/{id} → /ws/agent/{id}.
        location /api/ws/ {
            rewrite ^/api/ws/(.*)$ /ws/$1 break;
            proxy_pass $ds_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            # Апгрейд-запрос мелкий, ограничение скорости тут только мешает
            limit_rate 0;
        }

        # «Копия на флешку»: гигабайтные tar (копия сервера, архивы роликов) отдаёт сам API потоком.
        # proxy_buffering off нужен по двум причинам. Первая: иначе nginx копил бы ответ в памяти и
        # во временных файлах на диске (двойная запись гигабайт). Вторая, важнее: API отмечает «скачано»
        # только после последнего куска, а при буферизации он «отдал» бы всё в nginx за секунды, даже
        # если человек закрыл вкладку на середине, — копия и «водяной знак» роликов сдвинулись бы
        # зря. Без буфера обрыв клиента сразу виден API. Префикс длиннее /api/, поэтому стоит перед
        # ним; X-DS-Accel не передаём: этот роутер X-Accel-Redirect не отвечает. limit_rate 20m
        # остаётся (18 ГБ примерно за 15 минут).
        # Таймауты тут свои. proxy_read_timeout 3600s: POST /offsite/copy отвечает только после сборки
        # копии (дамп и шифрование большой базы идут минуты); с 300s nginx отдал бы 504, человек нажал бы
        # «Скачать» ещё раз, а API продолжил бы собирать. send_timeout 300s: если клиент (медленная
        # флешка, зависший браузер) пять минут не принимает данные, соединение закрывается, а не висит.
        location /api/offsite/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $ds_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            send_timeout 300s;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # API FastAPI
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $ds_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # «Отвечать X-Accel-Redirect можно» (см. /_media_files/ выше).
            # Ставит только nginx: присланный клиентом заголовок затирается.
            proxy_set_header X-DS-Accel 1;
            proxy_read_timeout 300s;
            client_max_body_size 2G;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # WebSocket дашборд
        location /ws/ {
            proxy_pass $ds_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            limit_rate 0;
        }

        # Swagger UI (доступ только из локальной сети)
        location /docs {
            proxy_pass $ds_api;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass $ds_api;
        }

        # Статус сервера
        location /health {
            proxy_pass $ds_api;
        }

        # Токен авторизации (для Swagger UI)
        location /token {
            proxy_pass $ds_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Админ-панель (статика). Файлы монтируются в /usr/share/nginx/panel.
        location / {
            root /usr/share/nginx/panel;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
