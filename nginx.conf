worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Скорость отдачи файлов мини ПК (ограничение чтобы не перегружать сеть).
    # 20m = 20 МБ/с на соединение — для ~10 экранов и файлов ~500 МБ.
    # Панель/API отдаются мгновенно (мелкие ответы лимита не достигают). 0 = без ограничения.
    limit_rate 20m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Отдача видеофайлов мини ПК для скачивания
        location /media/ {
            alias /data/media/;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "no-cache";
            # Разрешаем докачку (Range-запросы)
        }

        # API FastAPI (включая WebSocket /api/ws/*)
        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            client_max_body_size 2G;
            # WebSocket поддержка
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # WebSocket дашборд
        location /ws/ {
            proxy_pass http://api:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # Swagger UI (доступ только из локальной сети)
        location /docs {
            proxy_pass http://api:8000/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://api:8000/openapi.json;
        }

        # Статус сервера
        location /health {
            proxy_pass http://api:8000/health;
        }

        # Токен авторизации (для Swagger UI)
        location /token {
            proxy_pass http://api:8000/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Админ-панель (статика). Файлы монтируются в /usr/share/nginx/panel.
        location / {
            root /usr/share/nginx/panel;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
