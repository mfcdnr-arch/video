# ============================================================
# Локальный стенд разработки — надстройка к docker-compose.yml.
# Поднимается ТОЛЬКО через dev_stand.sh (проект dsdev, свои тома):
#   bash dev_stand.sh up | down | reset
#
#   • панель и API — на http://localhost:8088 (порт 80 на машине
#     разработчика обычно занят, 8080 — тоже);
#   • NTP наружу не публикуется: на машине разработчика порт 123/udp не
#     нужен и может быть занят системной службой времени.
#
# На боевом сервере этот файл НЕ используется.
# ============================================================
services:
  nginx:
    ports: !override
      - "8088:80"

  ntp:
    ports: !reset []
