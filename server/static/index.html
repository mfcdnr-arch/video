<script>
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }

// старт
async function boot(){
  try{
    ME = await api('/me');
  }catch(e){ /* токен невалиден — api() уже покажет логин */ return; }
  // Форс-смена пароля по умолчанию: панель не открываем, пока не сменён.
  if(ME && ME.must_change_password){ renderForcePassword(); return; }
  // Рекламодателю дашборд сети не положен — сразу его кабинет.
  renderApp(); nav(ME.role === 'advertiser' ? 'advertisers' : 'dash');
  // отметка активности (для отчёта по сессиям): сразу и каждые 2 минуты
  api('/session/ping',{method:'POST'}).catch(()=>{});
  setInterval(()=>{ if(TOKEN) api('/session/ping',{method:'POST'}).catch(()=>{}); }, 120000);
}
if(TOKEN){ boot(); } else { renderLogin(); }
</script>
<!-- ═══ WebSocket Real-Time Дашборд -->
