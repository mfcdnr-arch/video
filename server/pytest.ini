[pytest]
testpaths = tests

# passlib при импорте тянет модуль crypt, помеченный в Python 3.11+ как
# устаревший (удаление в 3.13). Это предупреждение стороннего пакета, к нашему
# коду отношения не имеет — глушим, чтобы вывод тестов был чистым.
# Так же и starlette 0.35: TestClient при импорте задевает устаревший алиас anyio.
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal.*:DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning
